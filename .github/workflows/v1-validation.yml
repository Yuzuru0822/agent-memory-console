name: V1 Windows validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - run: npx playwright install chromium
      - run: npm run test:workbench-ui
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-validation-results
          path: test-results/
          if-no-files-found: ignore
